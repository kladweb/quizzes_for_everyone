[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

[[edge_functions]]
path = "/"
function = "og"

[[edge_functions]]
path = "/allquizzes"
function = "og"

[[edge_functions]]
path = "/createquiz"
function = "og"

[[edge_functions]]
path = "/quizzes/*"
function = "og"
